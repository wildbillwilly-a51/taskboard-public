services:
  app:
    build:
      context: .
      args:
        NODE_OPTIONS: ${TASKBOARD_BUILD_NODE_OPTIONS:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://taskboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.standalone}@db:5432/taskboard
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.standalone}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TASKBOARD_AUTH_MODE: password
      TASKBOARD_OIDC_ISSUER: ${TASKBOARD_OIDC_ISSUER:-}
      TASKBOARD_OIDC_CLIENT_ID: ${TASKBOARD_OIDC_CLIENT_ID:-}
      TASKBOARD_OIDC_CLIENT_SECRET: ${TASKBOARD_OIDC_CLIENT_SECRET:-}
      TASKBOARD_OIDC_CALLBACK_URL: ${TASKBOARD_OIDC_CALLBACK_URL:-}
      TASKBOARD_PUBLIC_SHARES_ENABLED: "false"
      TASKBOARD_WEB_PUSH_ENABLED: "false"
    ports:
      - "${TASKBOARD_BIND_ADDRESS:-127.0.0.1}:${TASKBOARD_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 12s
      retries: 12
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.standalone}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "taskboard", "-d", "taskboard"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  database:
  uploads:
